[project]
    name = "pyphoton"
    version = "1.0.0"
    description = "Photon Python client"
    readme = "README.rst"
    license = { text = "MIT" }
    authors = [{ name = "Andrea Stagi", email = "stagi.andrea@gmail.com" }]
    urls = { "homepage" = "https://github.com/astagi/pyphoton" }
    dependencies = [
    "httpx>=0.23.0",
]

[build-system]
    requires = ["setuptools>=61.0", "wheel"]
    build-backend = "setuptools.build_meta"

[tool.setuptools]
    packages = { find = { where = ["."] } }

[dependency-groups]
    dev = [
        "codecov>=2.1.13",
        "coverage==4.5.2",
        "flake8==3.7.9",
        "mock==2.0.0",
        "pytest>=3.9.1",
        "pytest-cov>=2.6.0",
        "pytest-asyncio>=0.20.0",
        "respx>=0.21.0",
    ]
